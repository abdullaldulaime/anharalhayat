<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>التزامات الشركاء - شركة أنهار الحياة</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Tahoma, Arial, sans-serif;
      background:linear-gradient(135deg,#dbeafe,#eef2ff,#f8fafc);
      color:#1f2937;
      min-height:100vh;
    }

    .container{
      max-width:1100px;
      margin:40px auto;
      padding:20px;
    }

    .card{
      background:#ffffff;
      border-radius:25px;
      padding:40px 25px;
      text-align:center;
      box-shadow:0 15px 40px rgba(0,0,0,0.08);
    }

    .logo{
      width:90px;
      margin-bottom:15px;
    }

    h1{
      color:#23479b;
      margin:10px 0;
      font-size:36px;
    }

    h2{
      margin-top:5px;
      font-size:24px;
    }

    .subtitle{
      color:#64748b;
      font-size:18px;
      margin-top:15px;
    }

    .back{
      display:inline-block;
      margin-top:35px;
      padding:12px 25px;
      border-radius:12px;
      text-decoration:none;
      background:#23479b;
      color:white;
      font-weight:bold;
    }

    .back:hover{
      opacity:0.9;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <img src="logo.png" class="logo" alt="شعار شركة أنهار الحياة">

      <h1>شركة أنهار الحياة</h1>

      <h2>🤝 التزامات الشركاء</h2>

      <div class="subtitle">
        نظام متابعة وإدارة التزامات الشركاء
      </div>

      <a href="index.html" class="back">
        العودة إلى الصفحة الرئيسية
      </a>

    </div>

  </div>

</body>
</html>
