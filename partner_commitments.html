<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>التزامات الشركاء - شركة أنهار الحياة</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Tahoma, Arial, sans-serif;
  background:linear-gradient(135deg,#dbeafe,#eef2ff,#f8fafc);
  color:#1f2937;
  min-height:100vh;
}


/* =========================
   شاشة تسجيل الدخول
========================= */

.login-screen{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#dbeafe,#eef2ff,#f8fafc);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:#ffffff;
  border-radius:25px;
  padding:40px 30px;
  text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,0.12);
}

.login-logo{
  width:90px;
  height:90px;
  object-fit:contain;
  margin-bottom:10px;
}

.login-box h2{
  color:#23479b;
  margin:10px 0;
  font-size:28px;
}

.login-box p{
  color:#64748b;
  margin-bottom:25px;
  line-height:1.8;
  font-size:16px;
}

.pin-input{
  width:100%;
  height:58px;
  border:2px solid #dbeafe;
  border-radius:14px;
  text-align:center;
  font-size:28px;
  letter-spacing:10px;
  outline:none;
  direction:ltr;
  transition:.2s;
}

.pin-input:focus{
  border-color:#23479b;
  box-shadow:0 0 0 4px rgba(35,71,155,.08);
}

.login-btn{
  width:100%;
  margin-top:18px;
  height:52px;
  border:0;
  border-radius:14px;
  background:#23479b;
  color:#ffffff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.login-btn:hover{
  opacity:.92;
}

.error{
  min-height:26px;
  margin-top:14px;
  color:#dc2626;
  font-weight:bold;
}


/* =========================
   الصفحة الرئيسية
========================= */

.container{
  max-width:1100px;
  margin:40px auto;
  padding:20px;
  display:none;
}

.card{
  background:#ffffff;
  border-radius:25px;
  padding:40px 25px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

.logo{
  width:90px;
  height:90px;
  object-fit:contain;
  margin-bottom:15px;
}

h1{
  color:#23479b;
  margin:10px 0;
  font-size:36px;
}

h2{
  margin-top:5px;
  font-size:24px;
}

.subtitle{
  color:#64748b;
  font-size:18px;
  margin-top:15px;
}

.back{
  display:inline-block;
  margin-top:35px;
  padding:12px 25px;
  border-radius:12px;
  text-decoration:none;
  background:#23479b;
  color:white;
  font-weight:bold;
  transition:.2s;
}

.back:hover{
  opacity:.9;
}


/* =========================
   الموبايل
========================= */

@media(max-width:600px){

  .login-box{
    padding:30px 20px;
  }

  .login-box h2{
    font-size:24px;
  }

  h1{
    font-size:28px;
  }

  h2{
    font-size:21px;
  }

  .subtitle{
    font-size:16px;
  }

}

</style>
</head>


<body>


<!-- =========================
     شاشة رمز الدخول
========================= -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

    <img
      src="logo.png"
      class="login-logo"
      alt="شعار شركة أنهار الحياة"
    >

    <h2>🤝 التزامات الشركاء</h2>

    <p>
      هذه الصفحة مخصصة لقسم المالية
      <br>
      الرجاء إدخال رمز الدخول
    </p>

    <input
      type="password"
      id="pinInput"
      class="pin-input"
      maxlength="6"
      inputmode="numeric"
      autocomplete="off"
      placeholder="••••••"
    >

    <button
      class="login-btn"
      onclick="checkPin()"
    >
      دخول
    </button>

    <div
      class="error"
      id="errorMessage"
    ></div>

  </div>

</div>


<!-- =========================
     محتوى التزامات الشركاء
========================= -->

<div
  class="container"
  id="mainContent"
>

  <div class="card">

    <img
      src="logo.png"
      class="logo"
      alt="شعار شركة أنهار الحياة"
    >

    <h1>
      شركة أنهار الحياة
    </h1>

    <h2>
      🤝 التزامات الشركاء
    </h2>

    <div class="subtitle">
      نظام متابعة وإدارة التزامات الشركاء
    </div>

    <a
      href="index.html"
      class="back"
    >
      العودة إلى الصفحة الرئيسية
    </a>

  </div>

</div>


<script>

/* =========================
   رمز الدخول
========================= */

/*
غيّر هذا الرقم إلى رمزك الخاص
يجب أن يكون 6 أرقام
*/

const ACCESS_CODE = "582941";


const pinInput =
document.getElementById("pinInput");

const errorMessage =
document.getElementById("errorMessage");

const loginScreen =
document.getElementById("loginScreen");

const mainContent =
document.getElementById("mainContent");


/* =========================
   قفل الصفحة
========================= */

function lockPage(){

  loginScreen.style.display = "flex";

  mainContent.style.display = "none";

  pinInput.value = "";

  errorMessage.textContent = "";

  setTimeout(function(){

    pinInput.focus();

  },100);

}


/* =========================
   التحقق من الرمز
========================= */

function checkPin(){

  const enteredCode =
  pinInput.value.trim();


  if(enteredCode === ACCESS_CODE){

    loginScreen.style.display = "none";

    mainContent.style.display = "block";

    pinInput.value = "";

    errorMessage.textContent = "";

  }
  else{

    errorMessage.textContent =
    "رمز الدخول غير صحيح";

    pinInput.value = "";

    pinInput.focus();

  }

}


/* =========================
   السماح بالأرقام فقط
========================= */

pinInput.addEventListener(
"input",
function(){

  this.value =
  this.value.replace(/[^0-9]/g,"");

  errorMessage.textContent = "";

});


/* =========================
   زر Enter
========================= */

pinInput.addEventListener(
"keydown",
function(event){

  if(event.key === "Enter"){

    checkPin();

  }

});


/* =========================
   مهم جداً
   عند كل دخول أو Refresh
   يتم قفل الصفحة من جديد
========================= */

window.addEventListener(
"pageshow",
function(){

  lockPage();

});


</script>


</body>

</html>
