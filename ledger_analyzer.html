<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
كشف حساب زبائن مندوب
</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Tahoma;

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

color:white;

padding:25px;

}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

gap:20px;

margin-bottom:25px;

flex-wrap:wrap;

}

.logoTitle{

display:flex;
align-items:center;
gap:15px;

}

.logoTitle img{

width:60px;
height:60px;

background:white;

border-radius:14px;

padding:5px;

}

.logoTitle h1{

font-size:42px;
font-weight:900;

}

.actions{

display:flex;
gap:12px;
flex-wrap:wrap;

}

.btn{

border:none;

padding:14px 22px;

border-radius:14px;

font-size:16px;
font-weight:900;

cursor:pointer;

transition:.3s;

color:white;

}

.btn:hover{

transform:translateY(-4px);

}

.btn-home{
background:#334155;
}

.btn-print{
background:#9333ea;
}

.btn-excel{
background:#16a34a;
}

.btn-file{
background:#2563eb;
}

.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:12px;

margin-bottom:18px;

align-items:stretch;

}

.card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);

padding:16px;

border-radius:18px;

min-height:105px;

display:flex;

flex-direction:column;

justify-content:center;

}

.card h3{

font-size:18px;

color:#94a3b8;

margin-bottom:18px;

}

.card span{

font-size:28px;

font-weight:900;

direction:ltr;

display:block;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

line-height:1.3;

}

.blue{
color:#60a5fa;
}

.red{
color:#fb7185;
}

.green{
color:#4ade80;
}

.white{
color:white;
}

.filters{

display:grid;

grid-template-columns:
2fr repeat(5,1fr);

gap:14px;

margin-bottom:20px;

}

.search{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

padding:0 20px;

color:white;

font-size:17px;
font-weight:900;

}

.filterBtn{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

color:#cbd5e1;

font-size:16px;
font-weight:900;

cursor:pointer;

transition:.3s;

}

.filterBtn:hover{

background:#2563eb;
color:white;

}

.tableWrap{

overflow:auto;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

border-radius:24px;

padding:6px;

}

table{

width:100%;

border-collapse:collapse;

table-layout:fixed;

}

th{

padding:16px 10px;

background:
rgba(255,255,255,.04);

font-size:13px;

color:#94a3b8;

white-space:nowrap;

text-align:center;

}

td{

padding:14px 10px;

border-top:
1px solid rgba(255,255,255,.05);

font-size:14px;

font-weight:700;

vertical-align:middle;

text-align:center;

overflow:hidden;

text-overflow:ellipsis;

}

tr:hover{

background:
rgba(255,255,255,.03);

}

.customer{

font-size:15px;

font-weight:900;

line-height:1.7;

}

.customerCode{

margin-top:8px;

font-size:15px;

color:#64748b;

}

.balance{

font-size:24px;

font-weight:900;

direction:ltr;

white-space:nowrap;

}

.zero{
color:#4ade80;
}

.nonzero{
color:#fb7185;
}

.money{

  .customerCode{

margin-top:5px;

font-size:13px;

color:#64748b;

direction:ltr;

}

direction:ltr;
unicode-bidi:plaintext;

white-space:nowrap;

}

@media(max-width:1200px){

.cards{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:768px){

.cards{
grid-template-columns:1fr;
}

.filters{
grid-template-columns:1fr;
}

.logoTitle h1{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logoTitle">

<img src="./logo.png">

<h1>
كشف حساب زبائن مندوب
</h1>

</div>

<div class="actions">

<button
class="btn btn-home"
onclick="window.location.href='index.html'">

🏠 الرئيسية

</button>

<button
class="btn btn-print"
onclick="window.print()">

🖨️ طباعة

</button>

<button
class="btn btn-excel"
onclick="exportExcel()">

⬇️ اكسل

</button>

<label class="btn btn-file">

📂 رفع ملف

<input
type="file"
id="excelFile"
accept=".xlsx,.xls"
hidden>

</label>

</div>

</div>

<div class="cards">

<div class="card">

<h3>
إجمالي العملاء
</h3>

<span
class="blue"
id="totalCustomers">

0

</span>

</div>

<div class="card">

<h3>
لديهم رصيد
</h3>

<span
class="red"
id="withBalance">

0

</span>

</div>

<div class="card">

<h3>
صفر
</h3>

<span
class="green"
id="zeroBalance">

0

</span>

</div>

<div class="card">

<h3>
إجمالي الأرصدة
</h3>

<span
class="white money"
id="totalBalance">

0

</span>

</div>

</div>

<div class="filters">

<input
type="text"
id="searchInput"
class="search"
placeholder="🔎 بحث عن عميل...">

<button
class="filterBtn"
onclick="filterRows('all')">

الكل

</button>

<button
class="filterBtn"
onclick="filterRows('with')">

لديه رصيد

</button>

<button
class="filterBtn"
onclick="filterRows('zero')">

لا رصيد

</button>

<button
class="filterBtn"
onclick="filterRows('nopayment')">

بدون دفعة

</button>

<button
class="filterBtn"
onclick="filterRows('noinvoice')">

بدون فاتورة

</button>

</div>

<div class="tableWrap">

<table id="mainTable">

<thead>

<tr>

<th>
العميل
</th>

<th>
الرصيد
</th>

<th>
آخر فاتورة
</th>

<th>
تاريخ الفاتورة
</th>

<th>
آخر دفعة
</th>

<th>
تاريخ الدفعة
</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

<script>

let allData = [];

function formatMoney(value){

return Number(value || 0)
.toLocaleString('en-US',{
minimumFractionDigits:0,
maximumFractionDigits:2
});

}

function cleanNum(value){

return Number(
String(value || 0)
.replace(/,/g,'')
.replace(/[^\d.-]/g,'')
) || 0;

}

function formatDate(value){

if(!value) return '-';

try{

if(typeof value === 'number'){

const excelDate =
new Date(
(value - 25569) * 86400 * 1000
);

return excelDate
.toLocaleDateString('en-GB');

}

const d = new Date(value);

if(isNaN(d)) return '-';

return d.toLocaleDateString('en-GB');

}
catch{

return '-';

}

}

function renderTable(data){

const tbody =
document.getElementById('tbody');

tbody.innerHTML = '';

let totalCustomers = 0;
let withBalance = 0;
let zeroBalance = 0;
let totalBalance = 0;

data.forEach((row)=>{

if(!row.customer) return;

totalCustomers++;

const balance =
cleanNum(row.balance);

if(balance > 0){
withBalance++;
}
else{
zeroBalance++;
}

totalBalance += balance;

const tr =
document.createElement('tr');

tr.dataset.balance = balance;
tr.dataset.invoice = row.invoice;
tr.dataset.payment = row.payment;

tr.innerHTML = `

<td>

<div class="customer">
${row.customer}
</div>

<div class="customerCode">
${row.code || ''}
</div>

</td>

<td class="
balance
${balance > 0 ? 'nonzero' : 'zero'}
money">

${formatMoney(balance)}

</td>

<td class="money">
${row.invoice > 0
? formatMoney(row.invoice)
: '-'}
</td>

<td>
${row.invoiceDate || '-'}
</td>

<td class="money">
${row.payment > 0
? formatMoney(row.payment)
: '-'}
</td>

<td>
${row.paymentDate || '-'}
</td>

`;

tbody.appendChild(tr);

});

document.getElementById('totalCustomers')
.innerText =
formatMoney(totalCustomers);

document.getElementById('withBalance')
.innerText =
formatMoney(withBalance);

document.getElementById('zeroBalance')
.innerText =
formatMoney(zeroBalance);

document.getElementById('totalBalance')
.innerText =
formatMoney(totalBalance);

}

document
.getElementById('excelFile')
.addEventListener('change', function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

const data =
new Uint8Array(event.target.result);

const workbook =
XLSX.read(data,{
type:'array'
});

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(sheet,{
header:1,
defval:''
});

allData = [];

let currentCustomer = null;

rows.forEach((row)=>{

if(!row || row.length === 0) return;

const col0 =
String(row[0] || '').trim();

const col1 = row[1];
const col2 = row[2];
const col6 = cleanNum(row[6]);
const col7 = cleanNum(row[7]);
const col8 = cleanNum(row[8]);

/* تجاهل الفراغات */

if(!col0) return;

/* تجاهل Total */

if(
col0.toLowerCase() === 'total'
) return;

/* زبون جديد */

const isCustomer =

!col0.startsWith('RINV') &&
!col0.startsWith('CRS') &&
!col0.startsWith('INV') &&
!col0.startsWith('CSR') &&
col0 !== 'Initial Balance';

if(isCustomer){

currentCustomer = {

customer:col0,

code:
String(col2 || ''),

balance:col8,

invoice:0,
invoiceDate:'-',

payment:0,
paymentDate:'-'

};

allData.push(currentCustomer);

}

/* فاتورة */

if(
currentCustomer &&
(
col0.startsWith('RINV') ||
col0.startsWith('INV')
)
){

currentCustomer.invoice = col6;

currentCustomer.invoiceDate =
formatDate(col1);

}

/* دفعة */

if(
currentCustomer &&
(
col0.startsWith('CRS') ||
col0.startsWith('CSR')
)
){

currentCustomer.payment = col7;

currentCustomer.paymentDate =
formatDate(col1);

}

});

allData =
allData.filter(x =>
x.customer &&
x.customer !== '-'
);

renderTable(allData);

};

reader.readAsArrayBuffer(file);

});

document
.getElementById('searchInput')
.addEventListener('keyup', function(){

const value =
this.value.toLowerCase();

document
.querySelectorAll('#tbody tr')
.forEach((row)=>{

row.style.display =

row.innerText
.toLowerCase()
.includes(value)

? ''

: 'none';

});

});

function filterRows(type){

document
.querySelectorAll('#tbody tr')
.forEach((row)=>{

const balance =
Number(row.dataset.balance);

const invoice =
Number(row.dataset.invoice);

const payment =
Number(row.dataset.payment);

let show = true;

if(type === 'with'){
show = balance > 0;
}

if(type === 'zero'){
show = balance === 0;
}

if(type === 'nopayment'){
show = payment === 0;
}

if(type === 'noinvoice'){
show = invoice === 0;
}

if(type === 'all'){
show = true;
}

row.style.display =
show ? '' : 'none';

});

}

function exportExcel(){

const table =
document.getElementById('mainTable');

const wb =
XLSX.utils.table_to_book(table);

XLSX.writeFile(
wb,
'customers_report.xlsx'
);

}

</script>

</body>
</html>
