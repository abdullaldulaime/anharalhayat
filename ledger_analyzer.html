<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
كشف حساب زبائن مندوب
</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma;
background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

color:white;

padding:25px;
}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:25px;
gap:20px;
flex-wrap:wrap;

}

.logoTitle{

display:flex;
align-items:center;
gap:15px;

}

.logoTitle img{

width:60px;
height:60px;
border-radius:14px;
background:white;
padding:5px;

}

.logoTitle h1{

font-size:38px;
font-weight:900;

}

.actions{

display:flex;
gap:12px;
flex-wrap:wrap;

}

.btn{

border:none;
padding:14px 22px;
border-radius:14px;
font-size:17px;
font-weight:900;
cursor:pointer;
transition:.3s;

color:white;

}

.btn:hover{

transform:translateY(-4px);

}

.btn-home{
background:#334155;
}

.btn-print{
background:#9333ea;
}

.btn-excel{
background:#16a34a;
}

.btn-file{
background:#2563eb;
}

.cards{

display:grid;
grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:25px;

}

.card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);

padding:25px;

border-radius:24px;

}

.card h3{

font-size:18px;
color:#94a3b8;
margin-bottom:20px;

}

.card span{

font-size:42px;
font-weight:900;

}

.blue{
color:#60a5fa;
}

.red{
color:#f87171;
}

.green{
color:#4ade80;
}

.white{
color:white;
}

.filters{

display:grid;
grid-template-columns:
2fr repeat(5,1fr);

gap:14px;

margin-bottom:20px;

}

.search{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

padding:0 20px;

color:white;
font-size:17px;
font-weight:900;

}

.filterBtn{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

color:#cbd5e1;

font-size:16px;
font-weight:900;

cursor:pointer;

transition:.3s;

}

.filterBtn:hover{

background:#2563eb;
color:white;

}

.tableWrap{

overflow:auto;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

border-radius:24px;

}

table{

width:100%;
border-collapse:collapse;

}

th{

padding:22px 14px;

background:
rgba(255,255,255,.04);

font-size:17px;

color:#94a3b8;

}

td{

padding:22px 14px;

border-top:
1px solid rgba(255,255,255,.05);

font-size:18px;
font-weight:900;

}

tr:hover{

background:
rgba(255,255,255,.03);

}

.customer{

font-size:22px;
font-weight:900;

}

.customerCode{

margin-top:8px;
font-size:15px;
color:#64748b;

}

.balance{

font-size:34px;
font-weight:900;

}

.zero{
color:#4ade80;
}

.nonzero{
color:#fb7185;
}

.money{

direction:ltr;
unicode-bidi:plaintext;

}

@media(max-width:1200px){

.cards{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:768px){

.cards{
grid-template-columns:1fr;
}

.filters{
grid-template-columns:1fr;
}

.logoTitle h1{
font-size:28px;
}

}

</style>

</head>

<body>

<div class="topbar">

<div class="logoTitle">

<img src="./logo.png">

<h1>
كشف حساب زبائن مندوب
</h1>

</div>

<div class="actions">

<button class="btn btn-home"
onclick="window.location.href='index.html'">
🏠 الرئيسية
</button>

<button class="btn btn-print"
onclick="window.print()">
🖨️ طباعة
</button>

<button class="btn btn-excel"
onclick="exportExcel()">
⬇️ اكسل
</button>

<label class="btn btn-file">

📂 رفع ملف

<input
type="file"
id="excelFile"
accept=".xlsx,.xls"
hidden>

</label>

</div>

</div>

<div class="cards">

<div class="card">

<h3>
إجمالي العملاء
</h3>

<span class="blue" id="totalCustomers">
0
</span>

</div>

<div class="card">

<h3>
لديهم رصيد
</h3>

<span class="red" id="withBalance">
0
</span>

</div>

<div class="card">

<h3>
صفر
</h3>

<span class="green" id="zeroBalance">
0
</span>

</div>

<div class="card">

<h3>
إجمالي الأرصدة
</h3>

<span class="white money" id="totalBalance">
0
</span>

</div>

</div>

<div class="filters">

<input
type="text"
id="searchInput"
class="search"
placeholder="🔎 بحث عن عميل...">

<button class="filterBtn"
onclick="filterRows('all')">
الكل
</button>

<button class="filterBtn"
onclick="filterRows('with')">
لديه رصيد
</button>

<button class="filterBtn"
onclick="filterRows('zero')">
لا رصيد
</button>

<button class="filterBtn"
onclick="filterRows('nopayment')">
بدون دفعة
</button>

<button class="filterBtn"
onclick="filterRows('noinvoice')">
بدون فاتورة
</button>

</div>

<div class="tableWrap">

<table id="mainTable">

<thead>

<tr>

<th>
العميل
</th>

<th>
الرصيد
</th>

<th>
آخر فاتورة
</th>

<th>
تاريخ الفاتورة
</th>

<th>
آخر دفعة
</th>

<th>
تاريخ الدفعة
</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

<script>

let allData = [];

function formatMoney(value){

return Number(value || 0)
.toLocaleString('en-US');

}

function cleanNum(value){

return Number(
String(value || 0)
.replace(/,/g,'')
.replace(/[^\d.-]/g,'')
) || 0;

}

function renderTable(data){

const tbody =
document.getElementById('tbody');

tbody.innerHTML = '';

let totalCustomers = data.length;
let withBalance = 0;
let zeroBalance = 0;
let totalBalance = 0;

data.forEach((row)=>{

const balance =
cleanNum(row.balance);

if(balance === 0){
zeroBalance++;
}
else{
withBalance++;
}

totalBalance += balance;

const tr =
document.createElement('tr');

tr.dataset.balance = balance;
tr.dataset.invoice = row.invoice;
tr.dataset.payment = row.payment;

tr.innerHTML = `

<td>

<div class="customer">
${row.customer}
</div>

<div class="customerCode">
${row.code}
</div>

</td>

<td class="
balance
${balance === 0 ? 'zero' : 'nonzero'}
money">

${formatMoney(balance)}

</td>

<td class="money">
${formatMoney(row.invoice)}
</td>

<td>
${row.invoiceDate}
</td>

<td class="money">
${formatMoney(row.payment)}
</td>

<td>
${row.paymentDate}
</td>

`;

tbody.appendChild(tr);

});

document.getElementById('totalCustomers')
.innerText =
formatMoney(totalCustomers);

document.getElementById('withBalance')
.innerText =
formatMoney(withBalance);

document.getElementById('zeroBalance')
.innerText =
formatMoney(zeroBalance);

document.getElementById('totalBalance')
.innerText =
formatMoney(totalBalance);

}

document.getElementById('excelFile')
.addEventListener('change', function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

const data =
new Uint8Array(event.target.result);

const workbook =
XLSX.read(data,{
type:'array'
});

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(sheet,{
defval:''
});

allData = [];

rows.forEach((row,index)=>{

const values =
Object.values(row);

if(values.length < 2) return;

allData.push({

customer:
values[0] || ('عميل ' + (index+1)),

code:
values[1] || '',

balance:
cleanNum(values[2]),

invoice:
cleanNum(values[3]),

invoiceDate:
values[4] || '-',

payment:
cleanNum(values[5]),

paymentDate:
values[6] || '-'

});

});

renderTable(allData);

};

reader.readAsArrayBuffer(file);

});

document.getElementById('searchInput')
.addEventListener('keyup', function(){

const value =
this.value.toLowerCase();

document
.querySelectorAll('#tbody tr')
.forEach((row)=>{

row.style.display =
row.innerText
.toLowerCase()
.includes(value)
? ''
: 'none';

});

});

function filterRows(type){

document
.querySelectorAll('#tbody tr')
.forEach((row)=>{

const balance =
Number(row.dataset.balance);

const invoice =
Number(row.dataset.invoice);

const payment =
Number(row.dataset.payment);

let show = true;

if(type === 'with'){
show = balance > 0;
}

if(type === 'zero'){
show = balance === 0;
}

if(type === 'nopayment'){
show = payment === 0;
}

if(type === 'noinvoice'){
show = invoice === 0;
}

row.style.display =
show ? '' : 'none';

});

}

function exportExcel(){

const table =
document.getElementById('mainTable');

const wb =
XLSX.utils.table_to_book(table);

XLSX.writeFile(
wb,
'customers_report.xlsx'
);

}

</script>

</body>
</html>
