
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
كشف حساب زبائن مندوب
</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Tahoma;
background:
linear-gradient(
135deg,
#020617,
#0f172a,
#111827
);

color:white;

padding:25px;
}

.topbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:25px;

}

.logoTitle{

display:flex;
align-items:center;
gap:15px;

}

.logoTitle img{

width:55px;
height:55px;
border-radius:14px;
background:white;
padding:5px;

}

.logoTitle h1{

font-size:38px;
font-weight:900;

}

.actions{

display:flex;
gap:12px;
flex-wrap:wrap;

}

.btn{

border:none;
padding:14px 22px;
border-radius:14px;
font-size:17px;
font-weight:900;
cursor:pointer;
transition:.3s;

color:white;

}

.btn:hover{

transform:translateY(-4px);

}

.btn-home{
background:#334155;
}

.btn-print{
background:#9333ea;
}

.btn-excel{
background:#16a34a;
}

.btn-file{
background:#2563eb;
}

.cards{

display:grid;
grid-template-columns:repeat(4,1fr);

gap:20px;

margin-bottom:25px;

}

.card{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

backdrop-filter:blur(10px);

padding:25px;

border-radius:24px;

}

.card h3{

font-size:18px;
color:#94a3b8;
margin-bottom:20px;

}

.card span{

font-size:42px;
font-weight:900;

}

.blue{
color:#60a5fa;
}

.red{
color:#f87171;
}

.green{
color:#4ade80;
}

.white{
color:white;
}

.filters{

display:grid;
grid-template-columns:
2fr repeat(5,1fr);

gap:14px;

margin-bottom:20px;

}

.search{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

padding:0 20px;

color:white;
font-size:17px;
font-weight:900;

}

.filterBtn{

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

height:58px;

border-radius:16px;

color:#cbd5e1;

font-size:16px;
font-weight:900;

cursor:pointer;

transition:.3s;

}

.filterBtn:hover{

background:#2563eb;
color:white;

}

.tableWrap{

overflow:auto;

background:
rgba(255,255,255,.05);

border:
1px solid rgba(255,255,255,.08);

border-radius:24px;

}

table{

width:100%;
border-collapse:collapse;

}

th{

padding:22px 14px;

background:
rgba(255,255,255,.04);

font-size:17px;

color:#94a3b8;

}

td{

padding:22px 14px;

border-top:
1px solid rgba(255,255,255,.05);

font-size:18px;
font-weight:900;

}

tr:hover{

background:
rgba(255,255,255,.03);

}

.customer{

font-size:22px;
font-weight:900;

}

.customerCode{

margin-top:8px;
font-size:15px;
color:#64748b;

}

.balance{

font-size:34px;
font-weight:900;

}

.zero{
color:#4ade80;
}

.nonzero{
color:#fb7185;
}

.money{

direction:ltr;
unicode-bidi:plaintext;

}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="topbar">

<div class="logoTitle">

<img src="./logo.png">

<h1>
كشف حساب زبائن مندوب
</h1>

</div>

<div class="actions">

<button class="btn btn-home">
🏠 الرئيسية
</button>

<button class="btn btn-print">
🖨️ طباعة
</button>

<button class="btn btn-excel">
⬇️ اكسل
</button>

<label class="btn btn-file">

📂 رفع ملف

<input
type="file"
id="excelFile"
accept=".xlsx,.xls"
hidden>

</label>

</div>

</div>

<div class="cards">

<div class="card">

<h3>
إجمالي العملاء
</h3>

<span class="blue" id="totalCustomers">
0
</span>

</div>

<div class="card">

<h3>
لديهم رصيد
</h3>

<span class="red" id="withBalance">
0
</span>

</div>

<div class="card">

<h3>
صفر
</h3>

<span class="green" id="zeroBalance">
0
</span>

</div>

<div class="card">

<h3>
إجمالي الأرصدة
</h3>

<span class="white money" id="totalBalance">
0
</span>

</div>

</div>

<div class="filters">

<input
type="text"
id="searchInput"
class="search"
placeholder="🔎 بحث عن عميل...">

<button class="filterBtn">
لديه رصيد
</button>

<button class="filterBtn">
لا رصيد
</button>

<button class="filterBtn">
بدون دفعة
</button>

<button class="filterBtn">
بدون فاتورة
</button>

<button class="filterBtn">
ملف جديد
</button>

</div>

<div class="tableWrap">

<table>

<thead>

<tr>

<th>
العميل
</th>

<th>
الرصيد
</th>

<th>
آخر فاتورة
</th>

<th>
تاريخ الفاتورة
</th>

<th>
آخر دفعة
</th>

<th>
تاريخ الدفعة
</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

<script>

function formatMoney(value){

return Number(value || 0)
.toLocaleString('en-US');

}

document
.getElementById('searchInput')
.addEventListener('keyup', function(){

const value =
this.value.toLowerCase();

document
.querySelectorAll('#tbody tr')
.forEach((row)=>{

row.style.display =
row.innerText
.toLowerCase()
.includes(value)
? ''
: 'none';

});

});

</script>

</body>
</html>
